name: Test Connect adapter

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: simplexml
          tools: composer:v2
      - name: Install Cardo DRS
        run: |
          mkdir -p namingo
          cd namingo
          composer require namingo/cardo-drs --no-interaction --no-progress
      - name: Check syntax and adapter integration
        run: |
          php -l Connect.php
          php tests/ConnectTest.php
